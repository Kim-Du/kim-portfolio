    @theme {
      /* Colors */
      --color-ink-black: #17191c;
      --color-paper-white: #ffffff;
      --color-mist-gray: #f2f2f3;
      --color-fog-white: #fafafb;
      --color-slate-gray: #777b86;
      --color-ash-gray: #979799;
      --color-smoke-gray: #a3a6af;
      --color-blush-peach: #fbe1d1;
      --color-sienna-brown: #5d2a1a;

      /* Typography */
      --font-logo: 'Noto Sans SC', 'SimHei', sans-serif;
      --font-nav: 'Inter', 'Noto Sans SC', sans-serif;
      --font-section-title: 'Noto Serif SC', serif;
      --font-card-title: 'Noto Sans SC', sans-serif;
      --font-body: 'Noto Sans SC', sans-serif;
      --font-quote: 'LXGW WenKai TC', serif;

      /* Scale */
      --text-caption: 15px;
      --text-body: 17px;
      --text-body-lg: 20px;
      --text-subheading: 22px;
      --text-heading-sm: 26px;
      --text-heading: 44px;
      --text-heading-lg: 64px;
      --text-display: 80px;

      /* Spacing */
      --spacing-4: 4px;
      --spacing-8: 8px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-20: 20px;
      --spacing-24: 24px;
      --spacing-32: 32px;
      --spacing-40: 40px;
      --spacing-64: 64px;
      --spacing-80: 80px;

      /* Border Radius */
      --radius-cards: 24px;
      --radius-images: 12px;
      --radius-inputs: 16px;
      --radius-buttons: 9999px;
      --radius-elevatedcards: 20px;

      /* Shadows */
      --shadow-subtle: oklab(0 0 0 / 0.05) 0px 0px 0px 1px, rgba(0, 0, 0, 0.08) 0px 4px 24px 0px;
      --shadow-subtle-3: rgba(4, 23, 43, 0.05) 0px 0px 0px 1px, rgba(0, 0, 0, 0.1) 0px 20px 25px -5px, rgba(0, 0, 0, 0.1) 0px 8px 10px -6px;
    }

    body {
      font-family: var(--font-body);
      font-weight: 400;
      background-color: var(--color-paper-white);
      color: var(--color-ink-black);
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .section-title {
      font-family: var(--font-section-title);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.05em;
    }

    .nav-text {
      font-family: var(--font-nav);
      font-weight: 400;
    }

    .quote-text {
      font-family: var(--font-quote);
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    .pill-filled {
      background-color: var(--color-ink-black);
      color: var(--color-paper-white);
      border-radius: var(--radius-buttons);
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--color-ink-black);
      transition: opacity 0.2s;
      font-family: var(--font-nav);
    }
    .pill-filled:hover {
      opacity: 0.9;
    }
  </style>
